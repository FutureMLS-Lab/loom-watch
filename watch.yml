# The Apple Watch app and its complication, as XcodeGen targets.
#
# Not a project of its own: the watch app ships inside the iPhone app, so
# loom-desktop's iOS/project.yml includes this file and the targets land in
# the iPhone app's project, which also sets the bundle versions. Paths are
# relative to this file, and expect loom-desktop checked out beside it — the
# watch compiles its networking, models and server list.
targets:
  LoomWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: LoomWatch
        createIntermediateGroups: false
      - path: ../loom-desktop/iOS/Loom/Common/Cancellation.swift
      - path: ../loom-desktop/Sources/LoomDesktop/LoomAPI.swift
        group: Shared
      - path: ../loom-desktop/Sources/LoomDesktop/Models.swift
        group: Shared
      - path: ../loom-desktop/Sources/LoomDesktop/LoomServers.swift
        group: Shared
    dependencies:
      - target: LoomWatchWidgets
    info:
      path: LoomWatch/Info.plist
      properties:
        CFBundleDisplayName: Loom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: engineering.loom.ios
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: LoomWatch/LoomWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.engineering.loom
    settings:
      base:
        PRODUCT_NAME: LoomWatch
        PRODUCT_BUNDLE_IDENTIFIER: engineering.loom.ios.watchkitapp
        # Installed inside the iPhone app, never on its own: without this an
        # archive carries it twice and the export refuses it.
        SKIP_INSTALL: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true

  LoomWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: LoomWatchWidgets
        createIntermediateGroups: false
      - path: LoomWatch/Glance/Glance.swift
      - path: ../loom-desktop/Sources/LoomDesktop/Models.swift
        group: Shared
      - path: ../loom-desktop/Sources/LoomDesktop/LoomServers.swift
        group: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: LoomWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Loom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: LoomWatchWidgets/LoomWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.engineering.loom
    settings:
      base:
        PRODUCT_NAME: LoomWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: engineering.loom.ios.watchkitapp.widgets
        SKIP_INSTALL: true
